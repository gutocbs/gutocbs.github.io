<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Augusto Bernardes — Software engineer.">
    <title>Augusto Bernardes · Software engineer</title>
    <link rel="icon" href="assets/avatar.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skipToContent">Skip to content</a>

    <header class="site-header">
      <div class="header-identity">
        <img class="avatar" src="assets/avatar.svg" data-fallback="assets/avatar.svg" width="32" height="32" alt="Augusto Bernardes logo">
        <h1>Augusto Bernardes</h1>
        <span class="role-badge">Software engineer</span>
      </div>
      <label class="language-picker">
        <span class="visually-hidden" data-i18n="languageSelectorLabel">Website language</span>
        <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.5 1.65 2.25 3.73 2.25 6.25S9.5 12.6 8 14.25C6.5 12.6 5.75 10.52 5.75 8S6.5 3.4 8 1.75Z"/></svg>
        <select id="language-selector" aria-label="Website language"></select>
      </label>
    </header>

    <main id="main-content" class="page-layout">
      <section class="profile-content" aria-label="Resume content">
        <div class="resume-card">
          <div class="tab-list" role="tablist" aria-label="Resume sections">
            <button id="tab-about" role="tab" aria-selected="true" aria-controls="panel-about" data-panel="about">
              <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c.35-2.25 2.06-3.5 5-3.5s4.65 1.25 5 3.5"/></svg><span data-i18n="tabs.about">About</span>
            </button>
            <button id="tab-experience" role="tab" aria-selected="false" aria-controls="panel-experience" data-panel="experience" tabindex="-1">
              <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="8" rx="1"/><path d="M6 5V3.75c0-.55.45-1 1-1h2c.55 0 1 .45 1 1V5m-8 3h12M6.5 8v1h3V8"/></svg><span data-i18n="tabs.experience">Experience</span>
            </button>
            <button id="tab-projects" role="tab" aria-selected="false" aria-controls="panel-projects" data-panel="projects" tabindex="-1">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3.25 2.5h5.5l4 4v6.75a.75.75 0 0 1-.75.75H3.25a.75.75 0 0 1-.75-.75v-10a.75.75 0 0 1 .75-.75Z"/><path d="M8.75 2.5v4h4M5.5 10.25h5M5.5 12h3.25"/></svg><span data-i18n="tabs.projects">Projects</span>
            </button>
            <button id="tab-education" role="tab" aria-selected="false" aria-controls="panel-education" data-panel="education" tabindex="-1">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m1.5 6 6.5-3.5L14.5 6 8 9.5 1.5 6Z"/><path d="M4.25 7.5v2.75c1.9 1.65 5.6 1.65 7.5 0V7.5M14.5 6v4"/></svg><span data-i18n="tabs.education">Education</span>
            </button>
          </div>
          <div class="panel-wrap">
            <section id="panel-about" role="tabpanel" aria-labelledby="tab-about" data-document="About.md" aria-busy="true"><p class="muted">Loading content…</p></section>
            <section id="panel-experience" role="tabpanel" aria-labelledby="tab-experience" data-document="Experience.md" aria-busy="true" hidden><p class="muted">Loading content…</p></section>
            <section id="panel-projects" role="tabpanel" aria-labelledby="tab-projects" data-document="Projects.md" aria-busy="true" hidden><p class="muted">Loading content…</p></section>
            <section id="panel-education" role="tabpanel" aria-labelledby="tab-education" data-document="Education.md" aria-busy="true" hidden><p class="muted">Loading content…</p></section>
          </div>
        </div>
      </section>

      <aside class="sidebar" aria-label="Resume details">
        <section class="sidebar-section"><h2 data-i18n="sidebar.stacks.title">Most used stacks</h2><p class="sidebar-intro" data-i18n="sidebar.stacks.intro">Tools I use to build dependable software.</p><ul data-i18n-list="sidebar.stacks.items"></ul></section>
        <section class="sidebar-section"><h2 data-i18n="sidebar.links.title">Useful links</h2><ul data-i18n-list="sidebar.links.items"></ul></section>
        <section class="sidebar-section download"><h2 data-i18n="sidebar.download.title">Resume download</h2><a class="download-link" data-download-link download hidden><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2.25v7.5m0 0 3-3m-3 3-3-3M3 11.75v1.5c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-1.5"/></svg><span data-i18n="sidebar.download.label">PDF version</span></a><span class="download-placeholder" data-download-placeholder hidden>Available soon</span></section>
      </aside>
    </main>
  </body>
</html>
